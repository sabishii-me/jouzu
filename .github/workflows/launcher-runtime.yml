name: Windows published runtime
on:
  workflow_dispatch:
    inputs:
      launcher_version:
        description: Launcher release version
        type: string
        default: '0.1.24'
        required: true
      jouzu_version:
        description: Official Jouzu npm version
        type: string
        default: '0.1.18'
        required: true
      runtime_run_id:
        description: Successful run containing a qualified runtime artifact (empty prepares from npm)
        type: string
        default: ''
        required: false
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Install private build package manager
        run: |
          npm install --prefix "$env:RUNNER_TEMP/build-tools" pnpm@10.21.0 --ignore-scripts --no-audit --no-fund
      - name: Restore qualified runtime
        if: inputs.runtime_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          JOUZU_VERSION: ${{ inputs.jouzu_version }}
        run: |
          if ($env:RUNTIME_RUN_ID -notmatch '^\d+$') { throw 'Invalid runtime run ID' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUNTIME_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/launcher-runtime.yml') { throw 'Runtime source must be a successful runtime workflow' }
          gh run download $env:RUNTIME_RUN_ID --repo $env:GITHUB_REPOSITORY --name windows-published-runtime --dir "$env:RUNNER_TEMP/runtime-input"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = "$env:RUNNER_TEMP/runtime-input/jouzu-runtime.tgz"
          $expected = (Get-Content "$env:RUNNER_TEMP/runtime-input/jouzu-runtime.sha256" -Raw).Trim()
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Runtime archive integrity mismatch' }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/jouzu-runtime" | Out-Null
          tar -xzf $archive -C "$env:RUNNER_TEMP/jouzu-runtime"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = Get-Content "$env:RUNNER_TEMP/jouzu-runtime/app/node_modules/jouzu/package.json" -Raw | ConvertFrom-Json
          if ($package.name -ne 'jouzu' -or $package.version -ne $env:JOUZU_VERSION) { throw 'Runtime version mismatch' }
          node packaging/launcher/verify-runtime.mjs "$env:RUNNER_TEMP/jouzu-runtime/app"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare official published Jouzu runtime
        if: inputs.runtime_run_id == ''
        env:
          JOUZU_VERSION: ${{ inputs.jouzu_version || '0.1.18' }}
        run: |
          npm exec -- node packaging/launcher/prepare-published-runtime.mjs "$env:JOUZU_VERSION" "$env:RUNNER_TEMP/jouzu-runtime" "$env:RUNNER_TEMP/build-tools/node_modules/pnpm/bin/pnpm.cjs"
      - name: Archive qualified inputs and application
        run: |
          tar -czf "$env:RUNNER_TEMP/jouzu-runtime.tgz" -C "$env:RUNNER_TEMP/jouzu-runtime" source.json recipe/package.json recipe/pnpm-lock.yaml recipe/artifacts app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-FileHash "$env:RUNNER_TEMP/jouzu-runtime.tgz" -Algorithm SHA256).Hash | Out-File "$env:RUNNER_TEMP/jouzu-runtime.sha256" -Encoding ascii
      - name: Build Windows installer
        env:
          LAUNCHER_VERSION: ${{ inputs.launcher_version }}
          LAUNCHER_PUBLIC_KEY: ${{ vars.LAUNCHER_PUBLIC_KEY }}
          JOUZU_RECIPE_PUBLIC_KEY: ${{ vars.JOUZU_RECIPE_PUBLIC_KEY }}
          JOUZU_RECIPE_BASE_URL: ${{ vars.JOUZU_RECIPE_BASE_URL }}
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/update-config" | Out-Null
          node packaging/launcher/update-configuration.mjs "$env:RUNNER_TEMP/update-config"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./packaging/launcher/prepare-windows-bundle.ps1 -Prepared "$env:RUNNER_TEMP/jouzu-runtime" -Pnpm "$env:RUNNER_TEMP/build-tools/node_modules/pnpm" -Output "$env:RUNNER_TEMP/windows-bundle" -Version "$env:LAUNCHER_VERSION" -UpdateConfigDirectory "$env:RUNNER_TEMP/update-config"
          npm ci --prefix apps/launcher
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location apps/launcher
          try {
            npm run build
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Push-Location src-tauri
            try {
              cargo build --locked --release --bins
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            } finally { Pop-Location }
            npm run tauri -- build --config "$env:RUNNER_TEMP/windows-bundle/tauri-build.json"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer-unsigned
          path: apps/launcher/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-published-runtime
          path: |
            ${{ runner.temp }}/jouzu-runtime.tgz
            ${{ runner.temp }}/jouzu-runtime.sha256
          if-no-files-found: error
          retention-days: 7
