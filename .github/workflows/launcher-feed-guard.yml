name: Jouzu update feed guard

# Defence in depth: if a release ever reaches npm without its signed Windows update
# artifact, this becomes visible instead of silently leaving users unable to update.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Compare the published npm version with the signed feed
        env:
          JOUZU_RECIPE_PUBLIC_KEY: ${{ vars.JOUZU_RECIPE_PUBLIC_KEY }}
          JOUZU_RECIPE_BASE_URL: ${{ vars.JOUZU_RECIPE_BASE_URL }}
        run: node packaging/launcher/check-update-feed.mjs
      - name: Report the missing update artifact
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Published Jouzu version has no signed Windows update artifact'
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The signed update feed does not match the version published on npm. Run the update recipe for the published version."
          fi
