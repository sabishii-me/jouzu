name: Publish PyPI package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or commit to publish
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Reject the non-functional PyPI reservation
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path("python/jouzu/pyproject.toml").read_text()
          version = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE).group(1)
          if version == "0.0.1":
              raise SystemExit("PyPI 0.0.1 is a reservation and must not be republished for the npm-only v0.1 release")
          PY
      - run: uv build --project python/jouzu --out-dir dist/python
      - run: uvx --from twine twine check dist/python/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dist
          path: dist/python/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
