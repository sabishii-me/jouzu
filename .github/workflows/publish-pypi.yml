name: Publish PyPI package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or commit to publish
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Reject the non-functional PyPI reservation
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path("python/jouzu/pyproject.toml").read_text()
          version = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE).group(1)
          if version == "0.0.1":
              raise SystemExit("PyPI 0.0.1 is a reservation and must not be republished for the npm-only v0.1 release")
          PY
      - run: uv build --project python/jouzu --out-dir dist/python
      - run: uvx --from twine twine check dist/python/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-dist
          path: dist/python/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
